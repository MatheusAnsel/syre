name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tipos, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/syre_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos (código e testes)
        run: npm run typecheck

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Rodar testes com cobertura (falha abaixo do piso configurado)
        run: npm run test:coverage | tee coverage.txt

      - name: Resumo de cobertura no painel da execução
        if: always()
        run: |
          {
            echo "### Cobertura do backend"
            echo '```'
            sed -n '/Coverage summary/,/^=*$/p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar
        run: npm run build

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/
          if-no-files-found: ignore

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

      - name: Verificar tipos e compilar
        run: npm run build

  docker:
    name: Docker (sobe o compose e testa)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar .env de teste
        run: |
          {
            echo "JWT_SECRET=$(openssl rand -hex 48)"
            echo "ADMIN_NOME=CI"
            echo "ADMIN_EMAIL=ci@exemplo.com"
            echo "ADMIN_SENHA=senha-do-ci-123"
          } > .env

      - name: Subir a stack e esperar os healthchecks
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Teste de fumaça (API, proxy do nginx, login e documentação)
        run: |
          set -e
          curl -fsS http://localhost:3001/health
          curl -fsS http://localhost:8080/ | grep -q 'id="root"'
          # login passando pelo nginx (valida o proxy /api -> backend)
          resposta=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@exemplo.com","senha":"senha-do-ci-123"}')
          echo "$resposta" | grep -q '"perfil":"admin"'
          token=$(echo "$resposta" | sed -E 's/.*"token":"([^"]+)".*/\1/')
          curl -fsS -H "Authorization: Bearer $token" http://localhost:8080/api/dashboard >/dev/null
          curl -fsS http://localhost:3001/api/docs/ | grep -qi swagger

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
